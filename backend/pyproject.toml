[project]
name = "aria-backend"
version = "0.1.0"
description = "ARIA — Autonomous Reconciliation Intelligence Agent (backend)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "celery[redis]>=5.4",
  "redis>=5.0",
  "anthropic>=0.40",
  "openai-agents>=0.17",
  "langsmith>=0.1.140",
  "httpx>=0.27",
  "tenacity>=8.5",
  "structlog>=24.4",
  "python-multipart>=0.0.9",
  "boto3>=1.35",
  "openpyxl>=3.1",
  "pdfplumber>=0.11",
  "pillow>=10.4",
  "rapidfuzz>=3.9",
  "python-dateutil>=2.9",
  "PyJWT>=2.9",
  "bcrypt>=4.0",
  "cryptography>=43.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "pytest-mock>=3.14",
  "httpx>=0.27",
  "freezegun>=1.5",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: requires database",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = ["E501"]

[tool.coverage.run]
source = ["app"]
omit = ["app/workers/*", "app/main.py"]
