# Shared backend env for api, worker, and beat. Root `.env` supplies ${VAR} values;
# service-specific URLs (postgres, redis, minio hostnames) are fixed for Docker networking.
x-backend-environment: &backend-environment
  DATABASE_URL: postgresql+asyncpg://aria:aria@postgres:5432/aria
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ariaadmin
  S3_SECRET_KEY: ariaadmin
  S3_BUCKET: aria-documents
  S3_REGION: ${S3_REGION:-us-east-1}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  LLM_MODE: ${LLM_MODE:-mock}
  LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
  LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-aria}
  LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
  LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
  SONNET_MODEL: ${SONNET_MODEL:-claude-sonnet-4-6}
  HAIKU_MODEL: ${HAIKU_MODEL:-claude-haiku-4-5-20251001}
  OPUS_MODEL: ${OPUS_MODEL:-claude-opus-4-7}
  EXCHANGERATE_API_KEY: ${EXCHANGERATE_API_KEY:-}
  OPENEXCHANGERATES_APP_ID: ${OPENEXCHANGERATES_APP_ID:-}
  FX_CACHE_TTL_SECONDS: ${FX_CACHE_TTL_SECONDS:-3600}
  BASE_CURRENCY: ${BASE_CURRENCY:-MYR}
  FX_VARIANCE_BUFFER_PCT: ${FX_VARIANCE_BUFFER_PCT:-0.015}
  MATCH_CONFIDENCE_THRESHOLD: ${MATCH_CONFIDENCE_THRESHOLD:-0.75}
  EXTRACTION_ESCALATION_THRESHOLD: ${EXTRACTION_ESCALATION_THRESHOLD:-0.5}
  DATE_WINDOW_DAYS: ${DATE_WINDOW_DAYS:-5}
  ADMIN_API_KEY: ${ADMIN_API_KEY:-aria-dev-admin}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-aria-dev-jwt-secret-change-in-production}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
  WEBHOOK_MAX_RETRIES: ${WEBHOOK_MAX_RETRIES:-3}
  WEBHOOK_RETRY_BACKOFF_BASE_SECONDS: ${WEBHOOK_RETRY_BACKOFF_BASE_SECONDS:-5}
  WEBHOOK_SECRET_ENCRYPTION_KEY: ${WEBHOOK_SECRET_ENCRYPTION_KEY:-}
  BATCH_SIZE_THRESHOLD: ${BATCH_SIZE_THRESHOLD:-50}
  BATCH_TIME_WINDOW_MINUTES: ${BATCH_TIME_WINDOW_MINUTES:-15}
  CELERY_BEAT_INTERVAL_MINUTES: ${CELERY_BEAT_INTERVAL_MINUTES:-2}
  INGESTION_CONCURRENCY: ${INGESTION_CONCURRENCY:-3}
  INGESTION_MAX_RETRIES: ${INGESTION_MAX_RETRIES:-3}
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aria
      POSTGRES_PASSWORD: aria
      POSTGRES_DB: aria
    ports:
      - "5432:5432"
    volumes:
      - aria_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aria"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ariaadmin
      MINIO_ROOT_PASSWORD: ariaadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - aria_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      <<: *backend-environment
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@aria.local}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:5175}
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
              uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      <<: *backend-environment
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=INFO

  beat:
    build: ./backend
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      <<: *backend-environment
    command: celery -A app.workers.celery_app:celery_app beat --loglevel=INFO
    restart: unless-stopped

  frontend-novapay:
    build:
      context: ./frontend-novapay
      args:
        VITE_API_KEY: ${VITE_API_KEY:-}
    depends_on:
      - api
    ports:
      - "5173:80"

  frontend-admin:
    build: ./frontend-admin
    depends_on:
      - api
    ports:
      - "5174:80"

  frontend-tenant-mgmt:
    build: ./frontend-tenant-mgmt
    depends_on:
      - api
    ports:
      - "5175:80"

volumes:
  aria_pg:
  aria_minio:
