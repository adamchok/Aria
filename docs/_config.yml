# GitHub Pages — Jekyll + just-the-docs
# Preview: cd docs && bundle install && bundle exec jekyll serve --livereload

title: ARIA
description: >-
  Autonomous Reconciliation Intelligence Agent — AI-native cross-border
  payment reconciliation for SMEs. AI Marathon 2026, Challenge Track 3.

remote_theme: just-the-docs/just-the-docs@v0.10.1

url: "https://adamchok.github.io"
baseurl: "/Aria"

favicon_ico: "/assets/images/favicon.ico"

# ARIA financial UI — slate base, semantic status colours (see _sass/color_schemes/aria.scss)
color_scheme: aria

logo: "/assets/images/aria-mark.svg"

search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10

heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"
last_edit_timestamp: true
last_edit_time_format: "%B %d, %Y"

mermaid:
  version: "10.6.0"

callouts:
  highlight:
    title: Note
    color: yellow
  important:
    title: Important
    color: blue
  warning:
    title: Warning
    color: red
  tip:
    title: Tip
    color: green

# Sidebar order is set via nav_order in each page's front matter (Just the Docs).
# External links below append after all pages.

nav_external_links:
  - title: GitHub
    url: https://github.com/adamchok/Aria
    hide_url: false
  - title: OpenAPI
    url: http://localhost:8000/docs
    hide_url: false

aux_links:
  Repository: https://github.com/adamchok/Aria

footer_content: >-
  ARIA · AI Marathon 2026 · Challenge Track 3 — Global Treasury Agent.
  Documentation reflects production behaviour; amounts use tabular figures.

gh_edit_link: true
gh_edit_repository: https://github.com/adamchok/Aria
gh_edit_branch: master
gh_edit_view_mode: tree
gh_edit_source: docs
gh_edit_source_ext: md

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-github-metadata

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

sass:
  style: compressed
