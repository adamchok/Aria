# GitHub Pages — Jekyll configuration
# Enable: Settings → Pages → Deploy from branch → master → /docs
#
# just-the-docs is loaded via remote_theme (not bundled in github-pages gem).
# Local preview: cd docs && bundle install && bundle exec jekyll serve --livereload

title: ARIA
description: >-
  Autonomous Reconciliation Intelligence Agent — AI-native cross-border
  payment reconciliation for SMEs. AI Marathon 2026, Challenge Track 3.

remote_theme: just-the-docs/just-the-docs@v0.10.1

url: "https://adamchok.github.io"
baseurl: "/Aria"

callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  warning:
    title: Warning
    color: red

# Sidebar navigation order is controlled by nav_order in each page's front matter.
nav_external_links:
  - title: OpenAPI (local)
    url: http://localhost:8000/docs
    hide_url: false

aux_links:
  Repository: https://github.com/adamchok/Aria

footer_content: "Built for AI Marathon 2026 — Global Treasury Agent track."

gh_edit_link: true
gh_edit_repository: https://github.com/adamchok/Aria
gh_edit_branch: master
gh_edit_view_mode: tree
gh_edit_source: docs
gh_edit_source_ext: md

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-github-metadata

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
