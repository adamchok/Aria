server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Single-page app — fall through to index.html so client-side routes work.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Reverse-proxy API + WebSocket calls to the FastAPI service (Docker compose
  # network resolves "api" to the backend container).
  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Long-lived asset caching for hashed bundles.
  location /assets/ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
  }
}
